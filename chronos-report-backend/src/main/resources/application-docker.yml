# ============================================================================
# DOCKER profile - used by docker-compose. Service name "postgres" resolves
# via the compose network. Swagger UI is publicly reachable in this profile.
# ============================================================================
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/chronos?currentSchema=reporting
    username: ${DB_USERNAME:chronos}
    password: ${DB_PASSWORD:chronos}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

springdoc:
  swagger-ui:
    enabled: true

chronos:
  security:
    swagger-public: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}