# ============================================================================
# PROD profile - production. All secrets MUST be supplied via environment
# variables. Swagger UI is NOT publicly reachable in this profile.
# ============================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chronos?currentSchema=reporting}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

chronos:
  security:
    swagger-public: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}