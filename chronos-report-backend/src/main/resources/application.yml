# ============================================================================
# Chronos Backend - Global application configuration
# Profile-specific settings live in application-{profile}.yml
# ============================================================================
spring:
  application:
    name: chronos-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: reporting, staging, clean
    default-schema: reporting

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

chronos:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-should-be-a-very-long-random-secret-key-at-least-256-bits}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}